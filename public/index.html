<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LWP CRM</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/svg+xml" href="/mark.svg">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0B1530">
</head>
<body>
<div class="app-shell">

  <!-- ===== sidebar ===== -->
  <aside class="nav">
    <div class="nav-brand">
      <img src="/mark.svg" alt="LWP">
      <div>
        <div class="nav-brand-name">LWP <em>CRM</em></div>
        <div class="nav-brand-sub">Outreach &amp; partners</div>
      </div>
    </div>

    <a class="nav-link" data-route="dashboard"><span class="icon">◆</span> Dashboard</a>
    <a class="nav-link" data-route="organisations"><span class="icon">▤</span> Organisations</a>
    <a class="nav-link" data-route="search"><span class="icon">⌕</span> Find new</a>
    <a class="nav-link" data-route="bulk"><span class="icon">✉</span> Bulk email</a>
    <a class="nav-link" data-route="log"><span class="icon">≡</span> Log</a>
    <a class="nav-link" data-route="backup"><span class="icon">↓</span> Backup</a>

    <div class="nav-footer">
      <div>Last backup <span id="backupStatus" class="backup-status">never</span></div>
      <button id="logoutBtn">Sign out</button>
    </div>
  </aside>

  <!-- ===== main content ===== -->
  <main class="main" id="view"></main>
</div>

<!-- ===== detail panel (organisation) ===== -->
<div class="detail-overlay" id="detailOverlay"></div>
<div class="detail-panel" id="detailPanel"></div>

<!-- ===== modal (email drafter, add, etc.) ===== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBody"></div>
</div>

<!-- ===== toast ===== -->
<div class="toast" id="toast"></div>

<script src="/app.js" defer></script>
</body>
</html>
